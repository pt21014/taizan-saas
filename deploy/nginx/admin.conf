# 商家后台静态站点（admin.example.com）——apps/admin 的 Vite 构建产物。
#
# 宝塔面板放置位置：面板 → 网站 → 添加站点（纯静态，PHP 选"纯静态"）→
# 站点根目录指到 apps/admin 的构建产物部署目录（deploy/scripts/remote-deploy.sh
# 会把 `deploy/docker/Dockerfile.web --build-arg APP=admin` 的产物，或者
# `pnpm --filter @taizan/admin build` 本地构建的 `apps/admin/dist/`，铺到这里）→
# 该站点 → 设置 → 配置文件，把生成的 server{} 块整体替换成本文件内容。
#
# 本文件写于 apps/admin **落地之前**（仓库目前只有 apps/api、apps/client），
# 按 T4-3 蓝图给定的"标准 Vite SPA + 同源 /api/ 反代"形状预先写好；等 admin 落地后
# 直接可用，不需要因为这个站点长出来了而改动 nginx 配置。

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    root /www/wwwroot/admin.example.com;
    index index.html;

    ssl_certificate     /www/server/panel/vhost/cert/admin.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://$host$request_uri;

    include /www/server/panel/vhost/nginx/taizan-snippets/security-headers.conf;
    include /www/server/panel/vhost/nginx/taizan-snippets/gzip.conf;

    # 同源反代：前端一律打相对路径 `/api/...`，不需要处理跨域、不需要在前端配置里
    # 硬编码 API 域名。`/api/admin/*` 是 TENANT_TOKEN_ONLY_PREFIXES 之一，只认
    # Authorization 头里的 staff token，这里不需要也不应该在 nginx 层做任何鉴权。
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 同 api.conf：缺了这一行，限流会把所有访客算成同一个人。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    include /www/server/panel/vhost/nginx/taizan-snippets/spa.conf;

    access_log /www/wwwlogs/admin.example.com.log;
    error_log  /www/wwwlogs/admin.example.com.error.log;
}
