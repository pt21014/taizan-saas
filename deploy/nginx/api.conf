# API 站点（api.example.com → 127.0.0.1:3000）。
#
# 宝塔面板放置位置：面板 → 网站 → 添加站点（先建一个纯反代占位站点，或者用面板的
# "反向代理"功能建好之后）→ 该站点 → 设置 → 配置文件，把生成的 server{} 块整体
# 替换成本文件内容（证书路径 `ssl_certificate` 换成面板申请证书后写入的实际路径；
# `server_name` 换成你自己的域名）。用 docker-compose 部署时不用这份，
# 用 `deploy/docker/nginx-compose.conf`（同样的规则、不同的 upstream 写法，
# 见该文件头部注释）。
#
# PM2 cluster 模式下（deploy/pm2/ecosystem.config.cjs）全部实例共享同一个端口
# 3000——Node 自己的 cluster 模块在内核层面做负载均衡，nginx 这一层看到的永远是
# "一个后端"，不需要在这里配 upstream 多台。

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /www/server/panel/vhost/cert/api.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://$host$request_uri;

    # API 没有静态文件要伺服，请求体上限按"含图片的表单提交/文件上传"给够，
    # 不给的话大文件上传会先在 nginx 这一层就被 413 拦掉，日志里却完全看不出是 nginx 挡的
    # 还是应用挡的——排查时容易先冤枉错代码。
    client_max_body_size 20m;

    include /www/server/panel/vhost/nginx/taizan-snippets/security-headers.conf;
    include /www/server/panel/vhost/nginx/taizan-snippets/gzip.conf;

    # 健康检查不进访问日志：PM2/监控/容器编排每隔几秒到十几秒打一次，量级远超真实流量，
    # 日志里全是心跳会把需要排查的那几行真实请求淹没。
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # 支付回调：POST /api/public/pay/:channel/notify。
    # 验签验的是**原始请求字节**（apps/api/src/bootstrap/main.ts 里 `rawBody: true`
    # 那段注释讲得很清楚：body-parser 解析过再序列化回去，键序/空白就对不上微信发来的
    # 那串字节，验签必然失败——钱收到了，订单永远 PENDING，日志却指向"签名不对"，
    # 容易被误判成攻击而不是配置问题）。所以这条 location 刻意**不加任何**会改写请求体
    # 的指令：不加 sub_filter，不手动 `proxy_set_body`，不在这条路径上开
    # `gunzip`/`chunked_transfer_encoding off` 之类会重新组装 body 的模块。
    # `proxy_pass_request_body` 保留默认值 on，原样透传即可，不要“优化”它。
    location ~ ^/api/public/pay/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 【必须，缺了它限流形同虚设】链路是 客户端 → nginx → Node，
        # `$proxy_add_x_forwarded_for` = "客户端自己发来的 X-Forwarded-For（如果有）" +
        # 逗号 + "$remote_addr"（nginx 看到的直连来源 IP，攻击者伪造不了这一段）。
        # `resolveIps`（@taizan/ratelimit-core）按 `TRUSTED_PROXY_HOPS` 从**末尾**倒数着取，
        # 只信任"基础设施自己追加的那几段"，前面攻击者能写的部分一律不信。
        # 如果这一行漏配（比如手滑写成 `proxy_set_header X-Forwarded-For $http_x_forwarded_for;`
        # 直接透传客户端头，或者干脆不设置这个头），效果是**每个访客在应用侧看到的都是
        # nginx 自己的地址**——限流的 key 全部收敛成同一个 IP，变成"全站共用一份额度"：
        # 一个人登录失败 10 次，全站所有人一起被锁；反过来攻击者也可以对着一个不设防的头
        # 疯狂伪造前缀，把限流基数冲到失效。这正是 knowledge 线上真实出过的事故
        # （CLAUDE.md 第 6 条），`deploy/checks/ratelimit-spoof-check.sh` 就是打这里的。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # traceId 透传。nginx 默认就会原样转发请求头、原样带回响应头，这里写出来是为了
        # "显式声明"——以后如果有人在这个 server 块里加了 proxy_hide_header 或者
        # 换了别的 location 覆盖，这一行摆在这里能提醒"这个头是关键路径，别动它"。
        proxy_set_header X-Trace-Id $http_x_trace_id;

        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3000;
    }

    access_log /www/wwwlogs/api.example.com.log;
    error_log  /www/wwwlogs/api.example.com.error.log;
}
