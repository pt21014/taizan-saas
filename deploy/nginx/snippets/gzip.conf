# 静态站点 / API 响应压缩。宝塔放置位置同 security-headers.conf 的说明（方式 A/B 二选一）。
#
# 宝塔面板本身有一个全局"网站-配置-Gzip压缩"开关，如果已经开了那个，
# 这份文件里的设置会被站点级配置覆盖（nginx 同一作用域内以最内层为准），不冲突，
# 保留这份是为了脱离宝塔面板（纯 docker-compose 部署）时也有一致的压缩策略。
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/json
  application/javascript
  application/xml
  application/xml+rss
  image/svg+xml
  font/woff2;
