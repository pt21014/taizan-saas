# 生产环境的 Docker Compose 形态：api ×N 副本 + mysql + redis + nginx。
#
# 跟 docker-compose.dev.yml（弱口令、端口对宿主开放）不是同一档：dev 只起
# 基础设施给本地跑 `pnpm dev` 连；这份连 api 自己也在容器里跑，且不对宿主暴露
# 数据库/Redis 端口——只有 nginx 的 80/443 对外，mysql/redis/api 只在 compose
# 内部网络里互相可达。
#
# ── 敏感值不写进这个文件 ──────────────────────────────────────────────────────
# 密码、JWT 密钥、CRYPTO_KEYS 全部来自同目录下的 `.env.prod`（不提交进仓库，
# `.gitignore` 已经挡住所有 `.env*`）。本文件里出现的 `${VAR:-占位}` 默认值
# **只是为了让 `docker compose config` 在没有 .env.prod 时也能跑通语法检查**，
# 真正启动前必须用 `--env-file` 指到真实的 .env.prod，否则会用那个占位密码启动
# （占位密码在源码里，等于没有密码）。完整清单模板见 deploy/README.md。
#
# 用法：
#   cp deploy/docker/.env.prod.example .env.prod   # 改成真实的密钥/密码
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file ../../.env.prod \
#     up -d --build
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file ../../.env.prod \
#     up -d --scale api=3   # 需要几个 api 副本就填几
#
# 只校验语法（不需要 .env.prod，占位默认值够用）：
#   docker compose -f deploy/docker/docker-compose.prod.yml config

name: taizan-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taizan}
      MYSQL_USER: ${MYSQL_USER:-taizan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_IN_ENV_PROD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_IN_ENV_PROD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-u',
          'root',
          '-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME_IN_ENV_PROD}',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [internal]
    # 不映射端口到宿主：只有同网络内的 api 能连它。要临时用客户端连进去排查，
    # 用 `docker compose exec mysql mysql -uroot -p...`，不要图方便开端口映射。

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-CHANGE_ME_IN_ENV_PROD}',
        '--appendonly',
        'yes',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-CHANGE_ME_IN_ENV_PROD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: taizan-api:${TAIZAN_IMAGE_TAG:-local}
    restart: unless-stopped
    # 完整 env 清单见 apps/api/.env.example（由 zod schema 生成，缺字段启动即拒启并
    # 中文列出缺了什么，不需要在这里重复抄一遍）。这里只拼那几个"依赖 compose 内部
    # 服务名"的连接串，其余（JWT 三把密钥、CRYPTO_KEYS…）整份来自 env_file。
    env_file:
      # `required: false`：让 `docker compose config`（纯语法校验，见文件头用法）
      # 在还没创建 .env.prod 时也能跑通；真正 `up` 时如果这个文件缺失，
      # 上面那几个 `${VAR:-CHANGE_ME_IN_ENV_PROD}` 占位值会原样生效——那是明文
      # 弱密码，绝不能带着占位值对外提供服务，deploy/README.md 的自检顺序第一步
      # 就是确认 .env.prod 已经就位、且里面没有 CHANGE_ME 字样。
      - path: ../../.env.prod
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-taizan}:${MYSQL_PASSWORD:-CHANGE_ME_IN_ENV_PROD}@mysql:3306/${MYSQL_DATABASE:-taizan}
      REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_IN_ENV_PROD}@redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    # 不对外暴露端口：只有 nginx 服务能通过 compose 内部 DNS（服务名 `api`）访问它。
    # 需要几个副本用 `--scale api=N` 指定（见文件头用法），不在这里写死
    # `deploy.replicas`——那是 swarm/k8s 才生效的字段，普通 `docker compose up`
    # 不会按它自动扩容，写在这里反而造成"以为改了这个数字就会扩容"的误解。

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx-compose.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - api
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  internal:

volumes:
  mysql-data:
  redis-data:
