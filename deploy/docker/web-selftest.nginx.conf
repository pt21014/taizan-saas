# Dockerfile.web 镜像内置的最小 nginx 配置，**只用于 `docker run` 自测**
# （看这一个 app 的静态产物本身对不对：SPA 路由回退、index.html 不缓存）。
#
# 生产环境不用这份配置——生产走宝塔面板的 nginx，同源反代 /api/、安全头、gzip
# 等在 deploy/nginx/{admin,platform,site,client}.conf + deploy/nginx/snippets/ 里，
# 那几份是「进程外」的 nginx 配置，跟这份镜像内配置是两套东西，职责不重叠。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # 带 hash 的产物（assets/xxx-<hash>.js）可以放心长缓存。
  # 正则整段加引号：裸 `{8,}` 会被 nginx 配置解析器当成 location 块开始，
  # 报 unknown directive（数量限定符的花括号跟 nginx 语法的花括号撞了）。
  location ~* "\.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|svg|woff2?)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 单页应用回退：找不到的路径一律回 index.html，交给前端路由处理
  location / {
    try_files $uri $uri/ /index.html;
  }
}
