packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  '@tarojs/binding': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: set this to true or false
  prisma: true
